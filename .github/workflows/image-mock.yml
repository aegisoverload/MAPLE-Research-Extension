name: Image MAPLE smoke
on:
  push:
    paths: ['image_extension/**', '.github/workflows/image-mock.yml']
  pull_request:
    paths: ['image_extension/**', '.github/workflows/image-mock.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./image_extension
      - run: python -m unittest discover -s image_extension/tests -v
